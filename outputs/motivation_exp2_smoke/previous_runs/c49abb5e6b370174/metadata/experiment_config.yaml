nuscenes:
  dataroot: /data/qh/nuscenes/v1.0-trainval
  version: v1.0-trainval
dataset:
  exp1_config: /data/qh/phdCode/work4/Senna/experiments/motivation_exp1/config.yaml
  scene_manifest: /data/qh/phdCode/work4/Senna/outputs/motivation_exp1/manifest_summary.json
  frame_manifest: /data/qh/phdCode/work4/Senna/outputs/motivation_exp1/camera_manifest.csv
  max_scenes: 2
  cameras:
  - CAM_FRONT
  - CAM_FRONT_LEFT
  - CAM_FRONT_RIGHT
  - CAM_BACK_LEFT
  - CAM_BACK_RIGHT
  - CAM_BACK
pairs:
  keyframe_gaps:
  - 1
  - 2
  - 4
  allow_cross_scene: false
projection:
  near_plane_m: 0.1
  min_bbox_width_px: 8
  min_bbox_height_px: 8
  min_visible_area_ratio: 0.2
  visible_area_sensitivity:
  - 0.0
  - 0.2
  - 0.5
analysis:
  grid_shapes:
  - - 8
    - 8
  - - 16
    - 16
  - - 32
    - 32
  grid_rules:
  - any
  - coverage
  - center
  primary_grid_rule: any
  grid_min_coverage_ratio: 0.25
  ego_grid_shape:
  - 16
  - 16
  static_speed_threshold_mps: 0.5
  static_speed_sensitivity_mps:
  - 0.2
  - 0.5
  - 1.0
  translation_bins_m:
  - 0
  - 1
  - 3
  - 10
  - .inf
  yaw_bins_deg:
  - 0
  - 1
  - 3
  - 10
  - .inf
  distance_bins_m:
  - 0
  - 10
  - 30
  - 60
  - .inf
  bootstrap_iterations: 1000
  seed: 42
output:
  directory: /data/qh/phdCode/work4/Senna/outputs/motivation_exp2_smoke
  save_visualizations: true
  visualization_samples: 6
