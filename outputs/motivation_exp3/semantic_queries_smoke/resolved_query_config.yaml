senna:
  checkpoint_path: /data/qh/phdCode/work4/models/Senna
  device: cuda:1
  max_new_tokens: 64
  warmup_iterations: 2
  profile_repeats: 1
nuscenes:
  dataroot: /data/dataset/v1.0-trainval
  version: v1.0-trainval
  split: val
experiment:
  seed: 42
  max_scenes: 2
  sequence_lengths:
  - 5
  workloads:
  - fixed
  - mixed
  query_types:
  - category
  - existence
  - position
  - motion_prediction
  - meta_action_planning
  bootstrap_iterations: 2000
selection:
  vehicle_prefix: vehicle.
  excluded_vehicle_categories:
  - vehicle.bicycle
  - vehicle.motorcycle
  max_distance_m: 40.0
  forward_min_m: 0.0
  front_half_angle_degrees: 35.0
  min_sensor_points: 1
  existence_prefixes:
  - human.pedestrian.
  - vehicle.bicycle
  - vehicle.motorcycle
  existence_distance_m: 20.0
  position_lateral_edges_m:
  - -2.0
  - 2.0
  position_labels:
  - FRONT_LEFT
  - FRONT
  - FRONT_RIGHT
  future_steps: 6
  expected_interval_s: 0.5
  interval_tolerance_s: 0.1
  current_speed_bins_mps:
  - 0.5
  - 2.0
  - 5.0
  - 10.0
output:
  directory: /data/qh/phdCode/work4/Senna/outputs/motivation_exp3/semantic_queries_smoke
measurement_context: shared GPU allowed; concurrent workload can affect latency, not
  an exclusive-hardware benchmark
