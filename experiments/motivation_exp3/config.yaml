senna:
  checkpoint_path: "" # SENNA_MODEL_PATH, then E1 resolved configuration.
  device: cuda:0
  precision: fp16 # The original Senna loader uses fp16.
  use_original_preprocessing: true
  extract_projector_features: true
  feature_layers: [0, 6, 12, 18, 24] # Hidden state 0 is pre-LN embedding; selected layer is added.
  use_inference_mode: true
  batch_size: 1
  validation_images: 3
  equivalence_atol: 0.001
  equivalence_rtol: 0.001
data:
  nuscenes_dataroot: ""
  exp2_output_dir: outputs/motivation_exp2
  max_scenes: 10
  max_object_pairs: 3000
  min_bbox_width_px: 16
  min_bbox_height_px: 16
  min_projection_quality: 0.2
  min_retained_area_ratio: 0.5
  min_valid_patch_count: 2
  min_patch_coverage_ratio: 0.25 # Intersection / patch area.
analysis:
  time_gap_groups: [0.5, 1.0, 2.0]
  time_gap_tolerance_seconds: 0.15
  static_speed_threshold_mps: 0.5
  static_speed_sensitivity_mps: [0.2, 0.5, 1.0]
  patch_count_sensitivity: [2, 4, 8]
  similarity_metrics: [cosine, relative_l2]
  compare_same_instance: true
  compare_different_instance: true
  compare_fixed_position: true
  negative_max_area_ratio: 2.0
  negative_max_depth_ratio: 2.0
  fixed_position_grid: [4, 4] # Diagnostic sample of CLIP patch centers, not token compression.
  bootstrap_iterations: 1000
  seed: 42
output:
  directory: outputs/motivation_exp3
  save_raw_features: false
  raw_feature_max_images: 3
  raw_feature_budget_mb: 256
  save_object_features: true
  save_visualizations: true
  visualization_samples: 30

# Independent Experiment 3 semantic-query pipeline (run_queries.py).
# The original feature experiment above remains available via run_exp3.py.
semantic_queries:
  senna:
    checkpoint_path: /data/qh/phdCode/work4/models/Senna
    device: cuda:1
    max_new_tokens: 64
    warmup_iterations: 5
    profile_repeats: 1
  nuscenes:
    dataroot: /data/dataset/v1.0-trainval
    version: v1.0-trainval
    split: val
  experiment:
    seed: 42
    max_scenes: 3
    sequence_lengths: [5, 10, 20]
    workloads: [fixed, mixed]
    query_types: [category, existence, position, motion_prediction, meta_action_planning]
    bootstrap_iterations: 2000
  selection:
    # Current LiDAR coordinates: x right, y forward; radial XY distance.
    vehicle_prefix: vehicle.
    excluded_vehicle_categories: [vehicle.bicycle, vehicle.motorcycle]
    max_distance_m: 40.0
    forward_min_m: 0.0
    front_half_angle_degrees: 35.0
    min_sensor_points: 1
    # Negative existence answers require complete official annotation records.
    existence_prefixes: [human.pedestrian., vehicle.bicycle, vehicle.motorcycle]
    existence_distance_m: 20.0
    position_lateral_edges_m: [-2.0, 2.0]
    position_labels: [FRONT_LEFT, FRONT, FRONT_RIGHT]
    future_steps: 6
    expected_interval_s: 0.5
    interval_tolerance_s: 0.1
    current_speed_bins_mps: [0.5, 2.0, 5.0, 10.0]
  output:
    directory: outputs/motivation_exp3/semantic_queries
